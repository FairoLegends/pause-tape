<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pause Tape</title>
  <meta name="description" content="Pause a side project cleanly: record a tape to your future self, play it back when you return.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='7' width='28' height='18' rx='3' fill='%23070b14' stroke='%23d9dee8' stroke-width='2'/%3E%3Ccircle cx='11' cy='16' r='3.5' fill='none' stroke='%2362ff8f' stroke-width='2'/%3E%3Ccircle cx='21' cy='16' r='3.5' fill='none' stroke='%2362ff8f' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/VT323-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/vhs.css">
  <!-- GSAP (standard no-charge license, notices kept in the files) for text and screen motion -->
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrambleTextPlugin.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="tv">
    <div class="tv__screen">

      <!-- Tape Shelf: the home screen (prd.md > Tape Shelf) -->
      <section class="screen screen--shelf" data-screen="shelf" aria-label="Tape shelf" hidden>
        <header class="osd">
          <span class="osd__title">PAUSE TAPE</span>
          <span class="osd__stamp" data-shelf-stamp></span>
        </header>
        <div class="shelf" data-shelf></div>
        <footer class="osd osd--bottom">
          <button class="btn btn--rec" type="button" data-action="rec">
            <span class="ico ico--rec" aria-hidden="true"></span>REC
          </button>
        </footer>
      </section>

      <!-- Record Screen: camcorder viewfinder, everything on one screen (prd.md > Recording a Tape) -->
      <section class="screen screen--record" data-screen="record" aria-label="Record a tape" hidden>
        <div class="viewfinder" aria-hidden="true">
          <span class="viewfinder__corner viewfinder__corner--tl"></span>
          <span class="viewfinder__corner viewfinder__corner--tr"></span>
          <span class="viewfinder__corner viewfinder__corner--bl"></span>
          <span class="viewfinder__corner viewfinder__corner--br"></span>
        </div>
        <header class="osd">
          <span class="osd__rec"><span class="ico ico--rec" aria-hidden="true"></span>REC <span data-rec-clock>00:00:00</span></span>
          <span class="osd__stamp" data-rec-stamp></span>
        </header>

        <form class="record" data-record-form novalidate>
          <div class="record__body">
            <fieldset class="record__group record__group--label">
              <legend>TAPE LABEL</legend>
              <label class="field" data-field="project">
                <span class="field__name">PROJECT</span>
                <input name="project" type="text" maxlength="32" autocomplete="off" spellcheck="false">
              </label>
              <label class="field" data-field="returnDate">
                <span class="field__name">RETURN DATE <span class="field__hint" data-date-echo></span></span>
                <input name="returnDate" type="date">
              </label>
            </fieldset>

            <fieldset class="record__group record__group--message">
              <legend>MESSAGE TO FUTURE ME</legend>
              <label class="field" data-field="stopped">
                <span class="field__name">WHERE I STOPPED</span>
                <textarea name="stopped" rows="3"></textarea>
              </label>
              <label class="field" data-field="firstStep">
                <span class="field__name">FIRST STEP WHEN I COME BACK</span>
                <textarea name="firstStep" rows="3" placeholder="Small, about 10 minutes"></textarea>
              </label>
              <label class="field" data-field="unsure">
                <span class="field__name">WHAT I'M STILL UNSURE ABOUT</span>
                <textarea name="unsure" rows="3"></textarea>
              </label>
              <label class="field" data-field="why">
                <span class="field__name">WHY THIS PROJECT MATTERS TO ME</span>
                <textarea name="why" rows="3"></textarea>
              </label>
            </fieldset>
          </div>

          <div class="record__actions">
            <p class="record__error" data-record-error role="alert" hidden>TAPE INCOMPLETE</p>
            <button class="btn btn--quiet" type="button" data-action="back">BACK</button>
            <button class="btn btn--stop" type="submit">
              <span class="ico ico--stop" aria-hidden="true"></span>STOP
            </button>
          </div>
        </form>
      </section>

      <!-- Tape Saved Screen with the calendar file (prd.md > Calendar Reminder (.ics)) -->
      <section class="screen screen--saved" data-screen="saved" aria-label="Tape saved" hidden>
        <div class="saved">
          <p class="saved__title">TAPE SAVED</p>
          <p class="saved__label" data-saved-label></p>
          <div class="saved__actions">
            <button class="btn btn--play" type="button" data-action="add-calendar">Add to calendar (.ics)</button>
            <button class="btn" type="button" data-action="to-shelf">BACK TO SHELF</button>
          </div>
          <p class="saved__note" data-ics-note hidden></p>
        </div>
      </section>

      <!-- Early Play Confirmation: pressing a locked tape (prd.md > Early Play) -->
      <section class="screen screen--early" data-screen="early" aria-label="Play early?" hidden>
        <div class="saved">
          <p class="early__text" data-early-text></p>
          <div class="saved__actions">
            <button class="btn btn--play" type="button" data-action="early-play">
              <span class="ico ico--play" aria-hidden="true"></span>PLAY
            </button>
            <button class="btn" type="button" data-action="early-cancel">CANCEL</button>
          </div>
        </div>
      </section>

      <!-- Blue VCR Screen: the brief transition when a tape is played (prd.md > Playback) -->
      <section class="screen screen--blue" data-screen="blue" aria-label="Loading tape" hidden>
        <p class="blue__play"><span class="ico ico--play" aria-hidden="true"></span>PLAY</p>
        <div class="blue__bar" aria-hidden="true" data-blue-bar></div>
      </section>

      <!-- Playback Screen: answers one by one, then the first step and timer (prd.md > Playback) -->
      <section class="screen screen--playback" data-screen="playback" aria-label="Playing tape" hidden>
        <header class="osd">
          <span class="osd__play"><span class="ico ico--play" aria-hidden="true"></span>PLAY <span data-play-counter>0:00:00</span></span>
          <span class="osd__stamp" data-play-title></span>
        </header>
        <ol class="answers" data-answers aria-live="polite"></ol>
        <div class="first" data-first-step hidden>
          <span class="answer__label">FIRST STEP WHEN I COME BACK</span>
          <p class="first__text" data-first-text></p>
          <div class="first__row">
            <span class="timer" data-timer hidden>10:00</span>
            <button class="btn btn--back" type="button" data-action="back-on-it" hidden>I'm back on it</button>
          </div>
        </div>
        <footer class="osd osd--bottom osd--controls">
          <button class="btn btn--quiet" type="button" data-action="play-stop">
            <span class="ico ico--stop" aria-hidden="true"></span>STOP
          </button>
          <button class="btn" type="button" data-action="skip" aria-label="Skip to the first step">
            <span class="ico ico--ff" aria-hidden="true"><span class="ico ico--play"></span><span class="ico ico--play"></span></span>
          </button>
        </footer>
      </section>

      <!-- Back On It Screen: the result, then back to the shelf (prd.md > First Step and Timer) -->
      <section class="screen screen--backonit" data-screen="backonit" aria-label="Back on it" hidden>
        <div class="saved">
          <p class="saved__title backonit__text" data-backonit-text></p>
          <p class="saved__label" data-backonit-label></p>
        </div>
      </section>

      <div class="vhs" aria-hidden="true"></div>
    </div>
  </main>
</body>
</html>
