<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pause Tape — Room mockup</title>
  <link rel="icon" href="data:,">
  <!-- Design mockup for review (devpost/checklist.md > Final Review). Not the app.
       Open through the local server: http://localhost:8000/devpost/room-mockup.html -->
  <style>
    @font-face {
      font-family: 'VT323';
      src: url('../assets/fonts/VT323-Regular.ttf') format('truetype');
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070c;
      color: #d9dee8;
      font-family: 'VT323', ui-monospace, Consolas, monospace;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    /* Review panel (top right, so it never covers the window): what to look at + time switch. */
    .panel {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 5;
      width: min(300px, calc(100vw - 28px));
      padding: 10px 12px;
      border: 1px solid rgba(217, 222, 232, 0.18);
      border-radius: 8px;
      background: rgba(5, 7, 12, 0.78);
      backdrop-filter: blur(6px);
      font-size: 18px;
      line-height: 1.2;
    }

    .panel h1 {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: 0.08em;
    }

    .panel p {
      margin: 3px 0;
      color: rgba(217, 222, 232, 0.72);
    }

    .times {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .times button,
    .panel .toggle {
      padding: 1px 9px;
      border: 1px solid rgba(217, 222, 232, 0.3);
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font: inherit;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .panel .toggle {
      float: right;
    }

    .times button[aria-pressed='true'] {
      border-color: #62ff8f;
      color: #62ff8f;
    }

    .panel .clock {
      margin-top: 8px;
      color: rgba(217, 222, 232, 0.55);
    }

    .panel.is-hidden {
      width: auto;
    }

    .panel.is-hidden > :not(.toggle) {
      display: none;
    }

    .hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      z-index: 5;
      transform: translateX(-50%);
      padding: 2px 14px;
      border: 0;
      border-radius: 4px;
      background: rgba(5, 7, 12, 0.7);
      color: rgba(217, 222, 232, 0.8);
      font: inherit;
      font-size: 20px;
      letter-spacing: 0.06em;
      pointer-events: none;
    }

    .hint.is-button {
      border: 1px solid rgba(98, 255, 143, 0.6);
      color: #62ff8f;
      pointer-events: auto;
      cursor: pointer;
    }

    /* Used by the automated check so the overlay doesn't tint its brightness numbers. */
    .clean .panel,
    .clean .hint {
      visibility: hidden;
    }

    /* With the camera close to the TV the panel fades out so it never covers the screen. */
    .panel {
      transition: opacity 0.3s;
    }

    .zoomed .panel {
      opacity: 0.12;
    }

    .zoomed .panel:hover,
    .zoomed .panel:focus-within {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="stage" aria-label="Pause Tape room mockup"></div>

  <aside class="panel" data-panel>
    <button class="toggle" type="button" data-toggle>HIDE</button>
    <h1>ROOM MOCKUP</h1>
    <p>Move the mouse: the camera turns a little.</p>
    <p>Click the VCR: the TV goes from standby to the shelf and the camera moves in.</p>
    <p>The window pictures are placeholders for now.</p>
    <div class="times" role="group" aria-label="Time of day">
      <button type="button" data-time="auto">AUTO</button>
      <button type="button" data-time="morning">MORNING</button>
      <button type="button" data-time="day">DAY</button>
      <button type="button" data-time="afternoon">AFTERNOON</button>
      <button type="button" data-time="night">NIGHT</button>
    </div>
    <p class="clock" data-clock></p>
    <p>URL: ?time=morning|day|afternoon|night (pagi|siang|sore|malam also work)</p>
  </aside>
  <button class="hint" type="button" data-hint>CLICK THE VCR</button>

  <script type="module" src="room-mockup.js"></script>
</body>
</html>
